<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORBIS · Simulador 3D de sitios análogos</title>
<meta name="theme-color" content="#050607">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div id="globo"></div>
<svg id="linea"><path id="trazo" d="" fill="none" stroke="#ffffff" stroke-width="1" opacity="0"></path><circle id="ancla" r="3" fill="#ffffff" opacity="0"></circle></svg>

<header id="superior">
  <div class="marca-orbis">ORBIS</div>
  <nav id="menu">
    <button class="item" data-v="lugares">Sitios análogos</button>
    <button class="item" data-v="mision" id="itemMision">Misión</button>
    <button class="item" data-v="acerca">Acerca de</button>
  </nav>
  <button id="burger" aria-label="Abrir menú" aria-expanded="false"><span></span><span></span><span></span></button>
</header>

<section id="ventana" class="oculta"></section>
<aside id="ficha" class="oculta"></aside>

<button id="rotacion" title="Pausar rotación" aria-label="Pausar o reanudar la rotación del planeta"></button>

<div id="pista">Toca un punto del planeta para ver su ficha</div>
<div id="alt"></div>
<div id="aviso">DATOS DE PRUEBA</div>

<script src="lib/globe.gl.min.js"></script>
<script src="datos/lugares.js"></script>
<script src="app.js"></script>
</body>
</html>
