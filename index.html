<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORBIS · Simulador 3D de sitios análogos</title>
<meta name="theme-color" content="#050607">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div id="globo"></div>
<svg id="linea"><path id="trazo" d="" fill="none" stroke="#ffffff" stroke-width="1" opacity="0"></path><circle id="ancla" r="3" fill="#ffffff" opacity="0"></circle></svg>

<header id="superior">
  <div class="marca-orbis">ORBIS</div>
</header>

<div id="barra">
  <button id="tri" aria-label="Mostrar menú" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 8 L12 17 L19 8 Z" fill="currentColor"></path></svg></button>
  <nav id="menu" aria-label="Menú principal">
    <button class="item" data-v="mision" id="itemMision">Misión</button>
    <button class="item" data-v="objetivo" id="itemObjetivo">Objetivo</button>
    <button class="item" data-v="lugares">Sitios análogos</button>
    <button class="item item-ayuda" data-v="acerca" aria-label="Acerca de ORBIS" title="Acerca de ORBIS">?</button>
  </nav>
</div>

<button id="fueravista" class="oculta" aria-live="polite"><span>Punto no visible</span><small>Toca para centrarlo</small></button>

<div id="zoom" role="group" aria-label="Zoom del globo">
  <button id="zmas" aria-label="Acercar"><span></span><span></span></button>
  <button id="zmenos" aria-label="Alejar"><span></span></button>
</div>

<section id="ventana" class="oculta"></section>
<aside id="ficha" class="oculta"></aside>
<aside id="galeria" class="oculta"></aside>
<div id="visor" class="oculta" role="dialog" aria-modal="true" aria-label="Imagen ampliada">
  <button class="vcerrar" data-accion="visor-cerrar" aria-label="Cerrar imagen">✕</button>
  <button class="vant" data-accion="visor-ant" aria-label="Imagen anterior">‹</button>
  <figure><img id="vimg" alt=""><div class="vcarga" id="vcarga">Cargando imagen…</div><figcaption id="vpie"></figcaption></figure>
  <button class="vsig" data-accion="visor-sig" aria-label="Imagen siguiente">›</button>
</div>

<button id="rotacion" title="Pausar rotación" aria-label="Pausar o reanudar la rotación del planeta"></button>



<div id="pista">Toca un punto del planeta para ver su ficha</div>
<div id="alt"></div>
<div id="aviso">DATOS DE PRUEBA</div>

<script src="lib/globe.gl.min.js"></script>
<script src="datos/lugares.js"></script>
<script src="app.js"></script>
</body>
</html>
